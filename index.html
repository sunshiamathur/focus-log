<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus Log</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1b2433;--mute:#66728a;--line:#d7dce6;--accent:#e08a00;--bar:#2f5bea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121722;--card:#1b2231;--ink:#e8ecf4;--mute:#8d99b0;--line:#2c3547;--accent:#ffb02e;--bar:#6e8dff}}
:root[data-theme="dark"]{--bg:#121722;--card:#1b2231;--ink:#e8ecf4;--mute:#8d99b0;--line:#2c3547;--accent:#ffb02e;--bar:#6e8dff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;font-weight:800;margin:0 0 4px}
h2{font-size:1rem;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.clock{font-size:3.4rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
input{flex:1}
button{border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg)}
button.go{background:var(--accent);color:#1b1200}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);padding:4px 10px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--bar);outline-offset:2px}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.75rem;color:var(--mute)}
.bar{width:100%;background:var(--bar);border-radius:6px 6px 0 0;min-height:2px}
.col b{color:var(--ink);font-weight:600}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.empty{color:var(--mute);margin:0}
.tag{font-weight:600}.meta{color:var(--mute);font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>Focus Log</h1>
  <p class="sub">Time what you study. See where the week went.</p>

  <section class="card" aria-label="Timer">
    <div class="clock" id="clock" role="timer" aria-live="off">00:00:00</div>
    <div class="row" style="margin-top:12px">
      <select id="subject" aria-label="Subject"></select>
      <button class="go" id="toggle">Start session</button>
    </div>
    <div class="row" style="margin-top:12px">
      <input id="newSubject" placeholder="Add a subject, e.g. Calculus" maxlength="30">
      <button id="addSubject">Add subject</button>
    </div>
  </section>

  <section class="card" aria-label="This week">
    <h2>Last 7 days (minutes)</h2>
    <div class="chart" id="chart"></div>
  </section>

  <section class="card" aria-label="Sessions">
    <h2>Recent sessions</h2>
    <ul id="list"></ul>
  </section>
</main>

<script>
// ---- State & storage (try/catch: storage can be unavailable) ----
const KEY = 'focuslog:v1';
let state = { subjects: ['Reading', 'Coding'], sessions: [] };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.subjects && s.sessions) state = s; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

let startedAt = null, tick = null;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const fmt = ms => { const s = Math.floor(ms / 1000); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; };
const dayKey = d => new Date(d).toDateString();

// ---- Rendering ----
function renderSubjects() {
  const cur = $('subject').value;
  $('subject').innerHTML = '';
  state.subjects.forEach(s => { const o = document.createElement('option'); o.textContent = s; $('subject').appendChild(o); });
  if (state.subjects.includes(cur)) $('subject').value = cur;
}

function renderChart() {
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); return d; });
  const mins = days.map(d => Math.round(state.sessions.filter(s => dayKey(s.start) === dayKey(d)).reduce((a, s) => a + s.ms, 0) / 60000));
  const max = Math.max(30, ...mins);
  $('chart').innerHTML = days.map((d, i) =>
    `<div class="col"><b>${mins[i]}</b><div class="bar" style="height:${mins[i] / max * 100}px"></div>${d.toLocaleDateString(undefined, { weekday: 'short' })}</div>`).join('');
}

function renderList() {
  const ul = $('list'); ul.innerHTML = '';
  if (!state.sessions.length) { ul.innerHTML = '<p class="empty">No sessions yet. Pick a subject and start your first one.</p>'; return; }
  state.sessions.slice().reverse().slice(0, 8).forEach(s => {
    const li = document.createElement('li');
    li.innerHTML = `<div><span class="tag"></span><div class="meta"></div></div><button class="ghost" aria-label="Delete session">Delete</button>`;
    li.querySelector('.tag').textContent = `${s.subject} · ${Math.max(1, Math.round(s.ms / 60000))} min`;  // textContent avoids HTML injection
    li.querySelector('.meta').textContent = new Date(s.start).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' });
    li.querySelector('button').onclick = () => { state.sessions = state.sessions.filter(x => x !== s); save(); renderAll(); };
    ul.appendChild(li);
  });
}
const renderAll = () => { renderSubjects(); renderChart(); renderList(); };

// ---- Actions ----
$('toggle').onclick = () => {
  if (!startedAt) {
    startedAt = Date.now();
    $('toggle').textContent = 'Stop and save';
    tick = setInterval(() => $('clock').textContent = fmt(Date.now() - startedAt), 250);
  } else {
    clearInterval(tick);
    const ms = Date.now() - startedAt;
    if (ms >= 1000) state.sessions.push({ subject: $('subject').value, start: startedAt, ms });
    startedAt = null; save();
    $('clock').textContent = '00:00:00';
    $('toggle').textContent = 'Start session';
    renderAll();
  }
};
$('addSubject').onclick = () => {
  const v = $('newSubject').value.trim();
  if (v && !state.subjects.includes(v)) { state.subjects.push(v); save(); $('newSubject').value = ''; renderSubjects(); $('subject').value = v; }
};
$('newSubject').addEventListener('keydown', e => { if (e.key === 'Enter') $('addSubject').click(); });

renderAll();
</script>
</body>
</html>
